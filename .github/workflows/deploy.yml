name: Classic Mart staged promotion
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character Git commit SHA already certified by Classic Mart CI
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: classic-mart-production-promotion
  cancel-in-progress: false
jobs:
  verify-certified-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit SHA
        env:
          PROMOTE_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$PROMOTE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'commit_sha must be a full 40-character hexadecimal Git SHA.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Require the commit to be merged into main
        env:
          PROMOTE_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main --force
          git merge-base --is-ancestor "$PROMOTE_SHA" origin/main || { echo 'Only commits already merged into main may be promoted.' >&2; exit 1; }
      - name: Require a successful CI run for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_SHA: ${{ inputs.commit_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PROMOTE_SHA}&status=success&per_page=20" > /tmp/ci-runs.json
          jq -e --arg sha "$PROMOTE_SHA" '.workflow_runs | map(select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")) | length > 0' /tmp/ci-runs.json >/dev/null

  staging:
    needs: verify-certified-commit
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Trigger staging deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL" --output /dev/null
      - name: Verify exact staging build and readiness
        env:
          DEPLOY_BASE_URL: ${{ vars.BASE_URL }}
          EXPECTED_BUILD_SHA: ${{ inputs.commit_sha }}
        run: node scripts/deploy-smoke.js

  canary:
    needs: staging
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Trigger isolated canary deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL" --output /dev/null
      - name: Verify exact canary build and readiness
        env:
          DEPLOY_BASE_URL: ${{ vars.BASE_URL }}
          EXPECTED_BUILD_SHA: ${{ inputs.commit_sha }}
        run: node scripts/deploy-smoke.js

  production:
    needs: canary
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Trigger production deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL" --output /dev/null
      - name: Verify exact production build and post-deploy health
        env:
          DEPLOY_BASE_URL: ${{ vars.BASE_URL }}
          EXPECTED_BUILD_SHA: ${{ inputs.commit_sha }}
        run: node scripts/deploy-smoke.js
